<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCoach 1-on-1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide text-cyan-400">FITCOACH 1-ON-1</h1>
    <button id="logout-btn" onclick="logoutTrainer()" class="hidden text-xs bg-slate-700 hover:bg-slate-600 text-rose-400 px-3 py-1.5 rounded-lg border border-slate-600">
      Esci (PIN)
    </button>
  </header>

  <!-- Container Principale -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- VISTA 1: LOGIN TRAINER -->
    <section id="login-section" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl my-auto text-center">
      <h2 class="text-2xl font-bold text-slate-100 mb-2">Area Trainer</h2>
      <p class="text-sm text-slate-400 mb-6">Inserisci il PIN per accedere alla gestione clienti</p>
      
      <div class="flex justify-center gap-3 mb-6">
        <input type="password" maxlength="4" id="pin-input" placeholder="****" class="w-32 text-center text-2xl font-mono tracking-widest bg-slate-900 border border-slate-600 rounded-xl p-3 text-cyan-400 focus:outline-none focus:border-cyan-400">
      </div>
      
      <button onclick="checkPin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-bold py-3 rounded-xl text-base transition">
        Accedi
      </button>
      <p id="pin-error" class="text-xs text-rose-400 mt-3 hidden">PIN errato! Riprova.</p>
    </section>

    <!-- VISTA 2: SELETTORE CLIENTE (DASHBOARD) -->
    <section id="dashboard-section" class="hidden flex flex-col gap-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-lg font-bold text-slate-200">Seleziona Cliente</h3>
        <button onclick="toggleModal('modal-client', true)" class="bg-cyan-600 hover:bg-cyan-500 text-slate-900 text-xs font-bold px-3 py-2 rounded-xl transition">
          + Nuovo Cliente
        </button>
      </div>
      <div id="clients-list" class="flex flex-col gap-3"></div>
    </section>

    <!-- VISTA 3: SCHEDA ALLENAMENTO -->
    <section id="workout-section" class="hidden flex flex-col gap-6">
      
      <button onclick="showDashboard()" class="text-xs text-cyan-400 font-medium self-start flex items-center gap-1 hover:underline">
        ← Torna alla lista clienti
      </button>

      <!-- Card Cliente Selezionato -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
        <div class="flex justify-between items-start border-b border-slate-700 pb-3 mb-3">
          <div>
            <h2 id="client-name" class="text-2xl font-bold text-slate-100">-</h2>
            <p id="client-goal" class="text-sm text-cyan-400 font-medium">-</p>
          </div>
          <span id="session-count" class="bg-slate-700 text-xs px-3 py-1 rounded-full font-mono text-slate-300">
            Sessione -/-
          </span>
        </div>
      </div>

      <!-- Esercizi -->
      <div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <h3 class="text-lg font-bold text-slate-300">Scheda Allenamento</h3>
          <button onclick="toggleModal('modal-exercise', true)" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 border border-slate-600 text-xs font-bold px-3 py-1.5 rounded-xl transition">
            + Crea Esercizio
          </button>
        </div>
        <div id="exercises-list" class="flex flex-col gap-4"></div>
      </div>

    </section>

  </main>

  <!-- MODALE: NUOVO CLIENTE -->
  <div id="modal-client" class="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full flex flex-col gap-4">
      <h3 class="text-lg font-bold text-slate-100">Nuovo Cliente</h3>
      <input type="text" id="new-client-name" placeholder="Nome e Cognome" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      <input type="text" id="new-client-goal" placeholder="Obiettivo (es. Ipertrofia)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      <input type="number" id="new-client-sessions" placeholder="Sessioni Totali (es. 10)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      <div class="flex justify-end gap-2 mt-2">
        <button onclick="toggleModal('modal-client', false)" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold">Annulla</button>
        <button onclick="saveNewClient()" class="bg-cyan-600 text-slate-900 px-4 py-2 rounded-xl text-xs font-bold">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODALE: NUOVO ESERCIZIO -->
  <div id="modal-exercise" class="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full flex flex-col gap-4">
      <h3 class="text-lg font-bold text-slate-100">Nuovo Esercizio</h3>
      <input type="text" id="new-ex-name" placeholder="Nome Esercizio" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      <input type="text" id="new-ex-group" placeholder="Gruppo Muscolare (es. Petto)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      <div class="flex gap-2">
        <input type="number" id="new-ex-sets" placeholder="Serie (es. 4)" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
        <input type="text" id="new-ex-reps" placeholder="Reps (es. 8-10)" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
      </div>
      <div class="flex justify-end gap-2 mt-2">
        <button onclick="toggleModal('modal-exercise', false)" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold">Annulla</button>
        <button onclick="saveNewExercise()" class="bg-cyan-600 text-slate-900 px-4 py-2 rounded-xl text-xs font-bold">Salva</button>
      </div>
    </div>
  </div>

  <!-- Timer Bar Fissa -->
  <footer id="timer-footer" class="hidden sticky bottom-0 bg-slate-800 border-t border-slate-700 p-4 shadow-2xl">
    <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
      <div class="flex flex-col">
        <span class="text-xs text-slate-400 uppercase tracking-wider">Recupero</span>
        <span id="timer-display" class="text-2xl font-mono font-bold text-amber-400">00:00</span>
      </div>
      <div class="flex gap-2">
        <button onclick="startRest(60)" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 font-bold px-4 py-2 rounded-xl text-sm border border-slate-600 transition">60s</button>
        <button onclick="startRest(90)" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 font-bold px-4 py-2 rounded-xl text-sm border border-slate-600 transition">90s</button>
        <button onclick="stopTimer()" class="bg-rose-900/50 hover:bg-rose-800 text-rose-300 px-3 py-2 rounded-xl text-sm border border-rose-700">Stop</button>
      </div>
    </div>
  </footer>

  <script>
    const TRAINER_PIN = "1234";
    const SUPABASE_URL = "https://iqktzacvuhspdjdcwcnx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlxa3R6YWN2dWhzcGRqZGN3Y254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Mjg3MjYsImV4cCI6MjEwNDEwNDcyNn0.iTdWadVFqK1nh-iOFrwto7t3tXr346lJ9UpLwETGJnc";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeClient = null;
    let audioCtx = null;
    let timerInterval = null;

    function checkPin() {
      const pin = document.getElementById('pin-input').value;
      if (pin === TRAINER_PIN) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('pin-error').classList.add('hidden');
        showDashboard();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function logoutTrainer() {
      document.getElementById('pin-input').value = '';
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('workout-section').classList.add('hidden');
      document.getElementById('timer-footer').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
    }

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('hidden', !show);
    }

    async function showDashboard() {
      document.getElementById('workout-section').classList.add('hidden');
      document.getElementById('timer-footer').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');

      const container = document.getElementById('clients-list');
      container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Caricamento clienti...</p>';

      try {
        const { data: clients, error } = await supabaseClient.from('clients').select('*');
        if (error) throw error;

        container.innerHTML = '';
        clients.forEach(client => {
          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center cursor-pointer hover:border-cyan-500 transition';
          card.onclick = () => loadClientWorkout(client);
          card.innerHTML = `
            <div>
              <h4 class="font-bold text-slate-100 text-lg">${client.name || 'Senza Nome'}</h4>
              <p class="text-xs text-cyan-400 font-medium">${client.goal || 'Nessun obiettivo'}</p>
            </div>
            <span class="text-xs bg-slate-700 text-slate-300 font-mono px-3 py-1 rounded-full">
              Sess. ${client.current_session || 0}/${client.total_sessions || 0}
            </span>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<p class="text-sm text-rose-400 text-center py-4">Errore caricamento clienti</p>`;
      }
    }

    async function saveNewClient() {
      const name = document.getElementById('new-client-name').value;
      const goal = document.getElementById('new-client-goal').value;
      const sessions = parseInt(document.getElementById('new-client-sessions').value) || 10;

      if (!name) return alert("Inserisci il nome del cliente");

      const { error } = await supabaseClient.from('clients').insert([
        { name: name, goal: goal, current_session: 1, total_sessions: sessions }
      ]);

      if (error) {
        alert("Errore durante il salvataggio");
      } else {
        toggleModal('modal-client', false);
        showDashboard();
      }
    }

    async function loadClientWorkout(client) {
      activeClient = client;
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('workout-section').classList.remove('hidden');
      document.getElementById('timer-footer').classList.remove('hidden');

      document.getElementById('client-name').textContent = client.name || 'Cliente';
      document.getElementById('client-goal').textContent = client.goal || '';
      document.getElementById('session-count').textContent = `Sessione ${client.current_session || 0}/${client.total_sessions || 0}`;

      const container = document.getElementById('exercises-list');
      container.innerHTML = '<p class="text-sm text-slate-400">Caricamento esercizi...</p>';

      try {
        const { data: exercises, error } = await supabaseClient.from('exercises').select('*');
        if (error) throw error;

        container.innerHTML = '';
        exercises.forEach(ex => {
          let exName = 'Esercizio';
          let exGroup = '';

          try {
            const nameObj = typeof ex.name_json === 'string' ? JSON.parse(ex.name_json) : ex.name_json;
            const groupObj = typeof ex.group_json === 'string' ? JSON.parse(ex.group_json) : ex.group_json;
            exName = nameObj?.it || ex.name || 'Esercizio';
            exGroup = groupObj?.it || ex.group || '';
          } catch(e) {
            exName = ex.name || 'Esercizio';
          }

          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-2';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <span class="text-xs text-cyan-400 uppercase font-semibold">${exGroup}</span>
                <h4 class="text-lg font-bold text-slate-100">${exName}</h4>
              </div>
              <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono">${ex.sets || 3}x${ex.reps || '10'}</span>
            </div>
            <button onclick="logSet('${exName.replace(/'/g, "\\'")}', this)" class="mt-2 w-full bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-bold py-2 rounded-lg text-sm transition">
              Completa & Salva su DB
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-sm text-rose-400">Errore nel caricamento della scheda.</p>';
      }
    }

    async function saveNewExercise() {
  const name = document.getElementById('new-ex-name').value;
  const group = document.getElementById('new-ex-group').value;
  const sets = parseInt(document.getElementById('new-ex-sets').value) || 3;
  const reps = document.getElementById('new-ex-reps').value || '10';

  if (!name) return alert("Inserisci il nome dell'esercizio");

  try {
    const { error } = await supabaseClient.from('exercises').insert([
      {
        name_json: { it: name },
        group_json: { it: group },
        sets: sets,
        reps: reps
      }
    ]);

    if (error) throw error;

    // Pulisce i campi dell'input
    document.getElementById('new-ex-name').value = '';
    document.getElementById('new-ex-group').value = '';
    document.getElementById('new-ex-sets').value = '';
    document.getElementById('new-ex-reps').value = '';

    toggleModal('modal-exercise', false);
    if (activeClient) loadClientWorkout(activeClient);

  } catch (err) {
    console.error("Errore salvataggio esercizio:", err);
    alert("Errore salvataggio esercizio: " + (err.message || JSON.stringify(err)));
        }
      ]);

      if (error) {
        alert("Errore salvataggio esercizio");
      } else {
        toggleModal('modal-exercise', false);
        if (activeClient) loadClientWorkout(activeClient);
      }
    }

    async function logSet(exName, btn) {
      initAudio();
      try {
        btn.disabled = true;
        btn.textContent = 'Salvataggio...';

        const { error } = await supabaseClient.from('workout_logs').insert([
          { client_id: activeClient.id, exercise_name: exName, completed_sets: 1 }
        ]);

        if (error) throw error;

        btn.textContent = '✓ Salvato';
        btn.classList.replace('bg-cyan-600', 'bg-emerald-600');
        setTimeout(() => {
          btn.textContent = 'Completa & Salva su DB';
          btn.classList.replace('bg-emerald-600', 'bg-cyan-600');
          btn.disabled = false;
        }, 2000);
      } catch (err) {
        btn.textContent = 'Errore!';
        btn.classList.replace('bg-cyan-600', 'bg-rose-600');
      }
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 800, duration = 0.15) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startRest(seconds) {
      initAudio();
      clearInterval(timerInterval);
      let timeLeft = seconds;
      updateTimerDisplay(timeLeft);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playBeep(800, 0.15);
          setTimeout(() => playBeep(1200, 0.25), 200);
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function updateTimerDisplay(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    document.addEventListener('click', initAudio, { once: true });
  </script>
</body>
</html>
