<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCoach 1-on-1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 text-center">
    <h1 class="text-2xl font-bold tracking-wide text-cyan-400">FITCOACH 1-ON-1</h1>
  </header>

  <!-- Container Principale -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- Card Cliente -->
    <section id="client-card" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
      <div id="loading-state" class="text-center py-6">
        <p class="text-xl font-semibold animate-pulse text-amber-400">Caricamento Cliente...</p>
        <p class="text-xs text-slate-400 mt-1">Sincronizzazione Supabase Cloud...</p>
      </div>

      <div id="client-content" class="hidden">
        <div class="flex justify-between items-start border-b border-slate-700 pb-3 mb-3">
          <div>
            <h2 id="client-name" class="text-2xl font-bold text-slate-100">-</h2>
            <p id="client-goal" class="text-sm text-cyan-400 font-medium">-</p>
          </div>
          <span id="session-count" class="bg-slate-700 text-xs px-3 py-1 rounded-full font-mono text-slate-300">
            Sessione -/-
          </span>
        </div>
      </div>
    </section>

    <!-- Lista Esercizi -->
    <section id="exercises-section" class="flex flex-col gap-4 hidden">
      <h3 class="text-lg font-bold text-slate-300">Scheda Allenamento</h3>
      <div id="exercises-list" class="flex flex-col gap-4"></div>
    </section>

  </main>

  <!-- Timer Bar Fissa in Basso -->
  <footer class="sticky bottom-0 bg-slate-800 border-t border-slate-700 p-4 shadow-2xl">
    <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
      <div class="flex flex-col">
        <span class="text-xs text-slate-400 uppercase tracking-wider">Recupero</span>
        <span id="timer-display" class="text-2xl font-mono font-bold text-amber-400">00:00</span>
      </div>
      <div class="flex gap-2">
        <button onclick="startRest(60)" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 font-bold px-4 py-2 rounded-xl text-sm border border-slate-600 transition">60s</button>
        <button onclick="startRest(90)" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 font-bold px-4 py-2 rounded-xl text-sm border border-slate-600 transition">90s</button>
        <button onclick="stopTimer()" class="bg-rose-900/50 hover:bg-rose-800 text-rose-300 px-3 py-2 rounded-xl text-sm border border-rose-700">Stop</button>
      </div>
    </div>
  </footer>
<script>
    // 1. Configurazione Supabase (rinominato in supabaseClient per evitare conflitti)
    const SUPABASE_URL = "https://iqktzacvuhspdjdcwcnx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlxa3R6YWN2dWhzcGRqZGN3Y254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Mjg3MjYsImV4cCI6MjEwNDEwNDcyNn0.iTdWadVFqK1nh-iOFrwto7t3tXr346lJ9UpLwETGJnc";
    
    // Usiamo supabaseClient anziché 'supabase'
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Stato Audio e Timer
    let audioCtx = null;
    let timerInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 800, duration = 0.15) {
      initAudio();
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function notifyRestFinished() {
      playBeep(800, 0.15);
      setTimeout(() => playBeep(1200, 0.25), 200);

      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    function startRest(seconds) {
      initAudio();
      clearInterval(timerInterval);

      let timeLeft = seconds;
      updateTimerDisplay(timeLeft);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          notifyRestFinished();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function updateTimerDisplay(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      document.getElementById('timer-display').textContent = display;
    }

    // 3. Caricamento Dati e Render
    async function initApp() {
      try {
        // Usa supabaseClient
        const { data: client, error: clientError } = await supabaseClient
          .from('clients')
          .select('*')
          .eq('id', 1)
          .single();

        if (clientError) throw clientError;

        const { data: exercises, error: exError } = await supabaseClient
          .from('exercises')
          .select('*');

        if (exError) throw exError;

        document.getElementById('client-name').textContent = client.name;
        document.getElementById('client-goal').textContent = client.goal || '';
        document.getElementById('session-count').textContent = `Sessione ${client.current_session}/${client.total_sessions}`;

        const container = document.getElementById('exercises-list');
        container.innerHTML = '';

        exercises.forEach((ex) => {
          const nameObj = typeof ex.name_json === 'string' ? JSON.parse(ex.name_json) : ex.name_json;
          const groupObj = typeof ex.group_json === 'string' ? JSON.parse(ex.group_json) : ex.group_json;

          const exName = nameObj?.it || 'Esercizio';
          const exGroup = groupObj?.it || '';

          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-2';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <span class="text-xs text-cyan-400 uppercase font-semibold">${exGroup}</span>
                <h4 class="text-lg font-bold text-slate-100">${exName}</h4>
              </div>
              <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono">${ex.sets}x${ex.reps}</span>
            </div>
            <button onclick="logSet('${exName.replace(/'/g, "\\'")}', this)" class="mt-2 w-full bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-bold py-2 rounded-lg text-sm transition">
              Completa & Salva su DB
            </button>
          `;
          container.appendChild(card);
        });

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('client-content').classList.remove('hidden');
        document.getElementById('exercises-section').classList.remove('hidden');

      } catch (err) {
        console.error("Errore di caricamento:", err);
        document.getElementById('loading-state').innerHTML = `
          <p class="text-rose-400 font-bold">Errore di connessione al database</p>
          <p class="text-xs text-slate-400 mt-1">${err.message || err}</p>
        `;
      }
    }

    async function logSet(exName, btn) {
      initAudio();
      try {
        btn.disabled = true;
        btn.textContent = 'Salvataggio...';

        const { error } = await supabaseClient.from('workout_logs').insert([
          { client_id: 1, exercise_name: exName, completed_sets: 1 }
        ]);

        if (error) throw error;

        btn.textContent = '✓ Salvato';
        btn.classList.replace('bg-cyan-600', 'bg-emerald-600');
        setTimeout(() => {
          btn.textContent = 'Completa & Salva su DB';
          btn.classList.replace('bg-emerald-600', 'bg-cyan-600');
          btn.disabled = false;
        }, 2000);

      } catch (err) {
        console.error("Errore salvataggio:", err);
        btn.textContent = 'Errore!';
        btn.classList.replace('bg-cyan-600', 'bg-rose-600');
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
    document.addEventListener('click', initAudio, { once: true });
  </script>
  document.addEventListener('DOMContentLoaded', initApp);
    document.addEventListener('click', initAudio, { once: true });
  </script>
</body>
</html>
