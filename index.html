<script>
    // Configurazione
    const TRAINER_PIN = "1234"; // PIN di accesso
    const SUPABASE_URL = "https://iqktzacvuhspdjdcwcnx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlxa3R6YWN2dWhzcGRqZGN3Y254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzgwMTcsImV4cCI6MjA1NjzgNDAxN30.9-Kk_9kK3jW0l8S_mY7LdZ9Y_S2wL4X3K9Q8P1O0R0M";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeClientId = null;
    let audioCtx = null;
    let timerInterval = null;

    // Login & Autenticazione PIN
    function checkPin() {
      const pin = document.getElementById('pin-input').value;
      if (pin === TRAINER_PIN) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('pin-error').classList.add('hidden');
        showDashboard();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function logoutTrainer() {
      document.getElementById('pin-input').value = '';
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('workout-section').classList.add('hidden');
      document.getElementById('timer-footer').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
    }

    // Caricamento Lista Clienti
    async function showDashboard() {
      document.getElementById('workout-section').classList.add('hidden');
      document.getElementById('timer-footer').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');

      const container = document.getElementById('clients-list');
      container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Caricamento clienti...</p>';

      try {
        // Query diretta senza ordinamento
        const { data: clients, error } = await supabaseClient.from('clients').select('*');
        if (error) throw error;

        if (!clients || clients.length === 0) {
          container.innerHTML = '<p class="text-sm text-amber-400 text-center py-4">Nessun cliente trovato nel database.</p>';
          return;
        }

        container.innerHTML = '';
        clients.forEach(client => {
          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center cursor-pointer hover:border-cyan-500 transition';
          card.onclick = () => loadClientWorkout(client);
          card.innerHTML = `
            <div>
              <h4 class="font-bold text-slate-100 text-lg">${client.name || 'Senza Nome'}</h4>
              <p class="text-xs text-cyan-400 font-medium">${client.goal || 'Nessun obiettivo'}</p>
            </div>
            <span class="text-xs bg-slate-700 text-slate-300 font-mono px-3 py-1 rounded-full">
              Sess. ${client.current_session || 0}/${client.total_sessions || 0}
            </span>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Errore Supabase:", err);
        container.innerHTML = `
          <div class="text-center py-4">
            <p class="text-sm text-rose-400 font-bold">Errore di caricamento</p>
            <p class="text-xs text-slate-400 mt-1">${err.message || JSON.stringify(err)}</p>
          </div>
        `;
      }
    }

    // Caricamento Scheda Cliente
    async function loadClientWorkout(client) {
      activeClientId = client.id;
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('workout-section').classList.remove('hidden');
      document.getElementById('timer-footer').classList.remove('hidden');

      document.getElementById('client-name').textContent = client.name || 'Cliente';
      document.getElementById('client-goal').textContent = client.goal || '';
      document.getElementById('session-count').textContent = `Sessione ${client.current_session || 0}/${client.total_sessions || 0}`;

      const container = document.getElementById('exercises-list');
      container.innerHTML = '<p class="text-sm text-slate-400">Caricamento esercizi...</p>';

      try {
        const { data: exercises, error } = await supabaseClient.from('exercises').select('*');
        if (error) throw error;

        container.innerHTML = '';
        exercises.forEach(ex => {
          const nameObj = typeof ex.name_json === 'string' ? JSON.parse(ex.name_json) : ex.name_json;
          const groupObj = typeof ex.group_json === 'string' ? JSON.parse(ex.group_json) : ex.group_json;

          const exName = nameObj?.it || 'Esercizio';
          const exGroup = groupObj?.it || '';

          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-2';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <span class="text-xs text-cyan-400 uppercase font-semibold">${exGroup}</span>
                <h4 class="text-lg font-bold text-slate-100">${exName}</h4>
              </div>
              <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono">${ex.sets || 3}x${ex.reps || '10'}</span>
            </div>
            <button onclick="logSet('${exName.replace(/'/g, "\\'")}', this)" class="mt-2 w-full bg-cyan-600 hover:bg-cyan-500 text-slate-900 font-bold py-2 rounded-lg text-sm transition">
              Completa & Salva su DB
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-sm text-rose-400">Errore nel caricamento della scheda.</p>';
      }
    }

    async function logSet(exName, btn) {
      initAudio();
      try {
        btn.disabled = true;
        btn.textContent = 'Salvataggio...';

        const { error } = await supabaseClient.from('workout_logs').insert([
          { client_id: activeClientId, exercise_name: exName, completed_sets: 1 }
        ]);

        if (error) throw error;

        btn.textContent = '✓ Salvato';
        btn.classList.replace('bg-cyan-600', 'bg-emerald-600');
        setTimeout(() => {
          btn.textContent = 'Completa & Salva su DB';
          btn.classList.replace('bg-emerald-600', 'bg-cyan-600');
          btn.disabled = false;
        }, 2000);
      } catch (err) {
        btn.textContent = 'Errore!';
        btn.classList.replace('bg-cyan-600', 'bg-rose-600');
      }
    }

    // Audio & Timer
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 800, duration = 0.15) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startRest(seconds) {
      initAudio();
      clearInterval(timerInterval);
      let timeLeft = seconds;
      updateTimerDisplay(timeLeft);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playBeep(800, 0.15);
          setTimeout(() => playBeep(1200, 0.25), 200);
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function updateTimerDisplay(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    document.addEventListener('click', initAudio, { once: true });
  </script>
